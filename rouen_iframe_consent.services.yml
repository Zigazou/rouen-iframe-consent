services:
  logger.channel.rouen_iframe_consent:
    parent: logger.channel_base
    arguments: ['rouen_iframe_consent']

  Drupal\rouen_iframe_consent\Service\ThumbnailLookupUrlHandler\DailymotionThumbnailLookupUrlHandler:
    tags:
      - { name: rouen_iframe_consent.thumbnail_lookup_url_handler }

  Drupal\rouen_iframe_consent\Service\ThumbnailLookupUrlHandler\FacebookThumbnailLookupUrlHandler:
    tags:
      - { name: rouen_iframe_consent.thumbnail_lookup_url_handler }

  Drupal\rouen_iframe_consent\Service\ThumbnailLookupUrlHandler\InstagramThumbnailLookupUrlHandler:
    tags:
      - { name: rouen_iframe_consent.thumbnail_lookup_url_handler }

  Drupal\rouen_iframe_consent\Service\ThumbnailLookupUrlHandler\VimeoThumbnailLookupUrlHandler:
    tags:
      - { name: rouen_iframe_consent.thumbnail_lookup_url_handler }

  Drupal\rouen_iframe_consent\Service\ThumbnailLookupUrlHandler\XThumbnailLookupUrlHandler:
    tags:
      - { name: rouen_iframe_consent.thumbnail_lookup_url_handler }

  Drupal\rouen_iframe_consent\Service\ThumbnailLookupUrlHandler\YouTubeThumbnailLookupUrlHandler:
    tags:
      - { name: rouen_iframe_consent.thumbnail_lookup_url_handler }

  rouen_iframe_consent.iframe_parser:
    class: Drupal\rouen_iframe_consent\Service\IframeParser
    arguments:
      - !tagged_iterator rouen_iframe_consent.thumbnail_lookup_url_handler
      - '@config.factory'

  Drupal\rouen_iframe_consent\Service\IframeParser:
    alias: 'rouen_iframe_consent.iframe_parser'

  rouen_iframe_consent.remote_url_validator:
    class: Drupal\rouen_iframe_consent\Service\RemoteUrlValidator

  Drupal\rouen_iframe_consent\Service\RemoteUrlValidator:
    alias: 'rouen_iframe_consent.remote_url_validator'

  rouen_iframe_consent.thumbnail_manager:
    class: Drupal\rouen_iframe_consent\Service\ThumbnailManager
    arguments:
      - '@database'
      - '@queue'
      - '@file_system'
      - '@file_url_generator'
      - '@entity_type.manager'
      - '@entity_display.repository'
      - '@rouen_iframe_consent.iframe_parser'
      - '@cache_tags.invalidator'
      - '@logger.channel.rouen_iframe_consent'
      - '@media.oembed.url_resolver'
      - '@media.oembed.resource_fetcher'
      - '@http_client'
      - '@config.factory'
      - '@rouen_iframe_consent.remote_url_validator'

  Drupal\rouen_iframe_consent\Service\ThumbnailManager:
    alias: 'rouen_iframe_consent.thumbnail_manager'
